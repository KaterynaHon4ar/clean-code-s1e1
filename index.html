<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <meta charset="UTF-8">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
    >
    <link
      rel="stylesheet"
      href="style.css"
      media="screen"
    >
  </head>
  <body class="body">
    <header class="header">
      <img class="header__image" src="./eisenhower-matrix.jpg" alt="eisenhower matrix">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </header>
    <main class="main">
      <section class="new-task">
        <h3 class="heading new-task__heading">Add Item</h3>
        <div class="new-task__row">
          <input class="input-text new-task__input-text" type="text">
          <button class="button button_add">Add</button>
        </div>
      </section>
      <section class="todo">
        <h3 class="heading">Todo</h3>
        <ul class="list">
          <li class="input-row">
            <input type="checkbox" class="input-row__input-checkbox">
            <label class="input-row__label">Pay Bills</label>
            <input type="text" class="input-text input-row__input-text">
            <button class="button button_edit">Edit</button>
            <button class="button button_delete">
              <img src="./remove.svg" class="button__image" alt="delete button">
            </button>
          </li>
          <li class="input-row">
            <input type="checkbox" class="input-row__input-checkbox">
            <label class="input-row__label input-row__label_edit">Go Shopping</label>
            <input
                type="text"
                value="Go Shopping"
                class="input-text input-row__input-text input-row__input-text_edit">
            <button class="button button_save">Save</button>
            <button class="button button_delete">
              <img src="./remove.svg" class="button__image" alt="delete button">
            </button>
          </li>
      </ul>
      </section>
      <section class="completed">
        <h3 class="heading">Completed</h3>
        <ul class="list">
          <li class="input-row">
            <input type="checkbox" class="input-row__input-checkbox" checked>
            <label class="input-row__label input-row__label_completed">See the Doctor</label>
            <input type="text" class="input-text input-row__input-text">
            <button class="button button_edit">Edit</button>
            <button class="button button_delete">
              <img src="./remove.svg" class="button__image" alt="delete button">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
